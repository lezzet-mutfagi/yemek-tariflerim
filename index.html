<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezzet Mutfağı - Nefis Yemek Tarifleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    :root {
      --primary: #ff5e36;
      --primary-hover: #e04822;
      --dark: #1e293b;
      --light-bg: #fdfbf7;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--light-bg); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: linear-gradient(135deg, #ff6b4a 0%, #ff4b2b 100%);
      color: white;
      padding: 50px 20px 70px 20px;
      text-align: center;
      position: relative;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 25px rgba(255, 75, 43, 0.2);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.95;
      font-weight: 300;
    }

    .search-container {
      margin: -30px auto 30px auto;
      max-width: 650px;
      padding: 0 20px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .search-container input {
      width: 100%;
      padding: 16px 25px 16px 50px;
      border-radius: 50px;
      border: none;
      outline: none;
      font-size: 15px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      background: white;
    }

    .search-container input:focus {
      box-shadow: 0 12px 35px rgba(255, 94, 54, 0.2);
      transform: translateY(-2px);
    }

    .search-icon {
      position: absolute;
      left: 38px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      flex: 1;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(226, 232, 240, 0.7);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.1);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background: #f1f5f9;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(255, 94, 54, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--dark);
      line-height: 1.3;
    }

    .desc {
      font-size: 13.5px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
      flex: 1;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      text-align: center;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 94, 54, 0.25);
    }

    .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(255, 94, 54, 0.35);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 35px;
      border-radius: 24px;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .close {
      position: absolute;
      right: 20px; top: 20px;
      width: 36px; height: 36px;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #64748b;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--dark);
      margin-bottom: 15px;
      padding-right: 30px;
    }

    video {
      width: 100%;
      border-radius: 14px;
      margin: 15px 0;
      background: #000;
    }

    .section-subtitle {
      font-size: 16px;
      color: var(--primary);
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .modal-text {
      white-space: pre-line;
      line-height: 1.7;
      color: #334155;
      font-size: 14.5px;
      background: #f8fafc;
      padding: 15px 20px;
      border-radius: 12px;
    }

    footer {
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 25px;
      font-size: 13px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ Lezzet Mutfağı</h1>
    <p>Ev Yapımı En Özel & En Lezzetli Tarifler</p>
  </header>

  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" onkeyup="filterRecipes()" placeholder="Tarif adı, malzeme veya kategori arayın...">
  </div>

  <div class="container" id="recipeContainer">
    <p style="text-align: center; grid-column: 1/-1; padding: 40px; color: #64748b;">Leziz tarifler yükleniyor...</p>
  </div>

  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="mTitle" class="modal-title"></h2>
      
      <video id="mVideo" controls style="display:none;"></video>
      
      <div class="section-subtitle">🛒 Malzemeler</div>
      <p id="mIngredients" class="modal-text"></p>
      
      <div class="section-subtitle">👩‍🍳 Hazırlanışı</div>
      <p id="mInstructions" class="modal-text"></p>
    </div>
  </div>

  <footer>
    &copy; 2026 Lezzet Mutfağı - Tüm Hakları Saklıdır.
  </footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDvUOzYlEGl7V822mbtjopaFFW833QuOLbUwB1MelQAMMYG50GUyDk2r3oeeiq0eBlYlD0hmwwpILS/pub?output=csv'; 

    let allRecipes = [];
    const defaultImage = 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80';

    function loadRecipes() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allRecipes = results.data;
          renderRecipes(allRecipes);
        },
        error: function(err) {
          document.getElementById('recipeContainer').innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ef4444;'>Tarifler yüklenirken hata oluştu.</p>";
        }
      });
    }

    function renderRecipes(recipes) {
      const container = document.getElementById('recipeContainer');
      container.innerHTML = "";

      if(recipes.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #64748b;'>Henüz bir tarif bulunamadı.</p>";
        return;
      }

      recipes.forEach((r, index) => {
        if(!r.baslik || r.baslik.trim() === "") return;

        let imageUrl = (r.resimUrl && r.resimUrl.trim() !== "") ? r.resimUrl : defaultImage;
        
        const card = `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${imageUrl}" alt="${r.baslik}" onerror="this.onerror=null;this.src='${defaultImage}';">
            </div>
            <div class="card-body">
              <span class="tag">${r.kategori || 'Lezzet'}</span>
              <h3 class="title">${r.baslik}</h3>
              <p class="desc">${r.aciklama || 'Enfes lezzet tarifi.'}</p>
              <button class="btn" onclick="openModal(${index})">
                <span>Tarifi İncele</span> ➔
              </button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function filterRecipes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allRecipes.filter(r => 
        (r.baslik && r.baslik.toLowerCase().includes(query)) || 
        (r.malzemeler && r.malzemeler.toLowerCase().includes(query)) ||
        (r.kategori && r.kategori.toLowerCase().includes(query))
      );
      renderRecipes(filtered);
    }

    function openModal(index) {
      const r = allRecipes[index];
      document.getElementById('mTitle').innerText = r.baslik;
      document.getElementById('mIngredients').innerText = r.malzemeler || 'Malzeme bilgisi bulunmuyor.';
      document.getElementById('mInstructions').innerText = r.tarif || 'Hazırlanış detayı bulunmuyor.';

      const video = document.getElementById('mVideo');
      if(r.videoUrl && r.videoUrl.trim() !== "") {
        video.src = r.videoUrl;
        video.style.display = "block";
      } else {
        video.style.display = "none";
        video.src = "";
      }

      document.getElementById('recipeModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('recipeModal').style.display = 'none';
      document.getElementById('mVideo').pause();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('recipeModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    loadRecipes();
  </script>
</body>
</html>
