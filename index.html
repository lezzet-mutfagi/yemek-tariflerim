<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezzet Mutfağı - Nefis Yemek Tarifleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    :root {
      --primary: #ff5e36;
      --primary-hover: #e04822;
      --dark: #1e293b;
      --light-bg: #fdfbf7;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--light-bg); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* --- VİDEO ARKA PLANLI VİPR HEADER ALANI --- */
    header {
      position: relative;
      color: white;
      padding: 40px 20px 80px 20px;
      text-align: center;
      border-radius: 0 0 35px 35px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      min-height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Arka Plan Videosu */
    .header-video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.65) contrast(1.1);
    }

    /* Videonun üzerindeki Turuncu Gradyan Filtresi */
    .header-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255, 75, 43, 0.75) 0%, rgba(224, 72, 34, 0.65) 100%);
      z-index: 2;
      backdrop-filter: blur(2px);
    }

    /* Tarih & Saat Kutusu */
    .time-badge {
      position: absolute;
      top: 20px;
      right: 25px;
      z-index: 4;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-content {
      position: relative;
      z-index: 3;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .greeting-text {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 5px;
      opacity: 0.9;
      color: #ffe4de;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    header p.subtitle {
      font-size: 15px;
      opacity: 0.95;
      font-weight: 300;
      margin-bottom: 25px;
      letter-spacing: 0.3px;
    }

    /* Modern Kategori Sekmeleri */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 9px 20px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    .pill-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      font-weight: 700;
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    /* Arama Çubuğu */
    .search-container {
      margin: -32px auto 35px auto;
      max-width: 620px;
      padding: 0 20px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .search-container input {
      width: 100%;
      padding: 17px 25px 17px 52px;
      border-radius: 50px;
      border: 1px solid rgba(0,0,0,0.05);
      outline: none;
      font-size: 15px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      background: white;
    }

    .search-container input:focus {
      box-shadow: 0 15px 35px rgba(255, 94, 54, 0.25);
      transform: translateY(-2px);
    }

    .search-icon {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
    }

    /* İçerik Düzeni */
    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 20px 50px 20px;
      width: 100%;
      flex: 1;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(226, 232, 240, 0.7);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 35px rgba(0,0,0,0.1);
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      background: #f1f5f9;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(255, 94, 54, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--dark);
      line-height: 1.3;
    }

    .desc {
      font-size: 13.5px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 20px;
      flex: 1;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      text-align: center;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(255, 94, 54, 0.25);
    }

    .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 18px rgba(255, 94, 54, 0.35);
    }

    /* Modal (Pop-up) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 35px;
      border-radius: 24px;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .close {
      position: absolute;
      right: 20px; top: 20px;
      width: 36px; height: 36px;
      background: #f1f5f9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #64748b;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      color: var(--dark);
      margin-bottom: 15px;
      padding-right: 30px;
    }

    video.modal-video {
      width: 100%;
      border-radius: 14px;
      margin: 15px 0;
      background: #000;
    }

    .section-subtitle {
      font-size: 16px;
      color: var(--primary);
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .modal-text {
      white-space: pre-line;
      line-height: 1.7;
      color: #334155;
      font-size: 14.5px;
      background: #f8fafc;
      padding: 15px 20px;
      border-radius: 12px;
    }

    footer {
      background: #0f172a;
      color: #94a3b8;
      text-align: center;
      padding: 25px;
      font-size: 13px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <!-- Döngüsel Arka Plan Videosu -->
    <video class="header-video" autoplay loop muted playsinline poster="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1400&q=80">
      <source src="https://assets.mixkit.co/videos/preview/mixkit-cooking-a-delicious-sauce-in-a-pan-43486-large.mp4" type="video/mp4">
    </video>
    
    <!-- Filtre Katmanı -->
    <div class="header-overlay"></div>

    <!-- Canlı Saat & Tarih -->
    <div class="time-badge">
      <span>⏰</span>
      <span id="liveClock">Yükleniyor...</span>
    </div>

    <div class="header-content">
      <div class="greeting-text" id="greeting">Hoş Geldiniz</div>
      <h1>✨ Lezzet Mutfağı</h1>
      <p class="subtitle">Ev Yapımı En Özel & En Lezzetli Tarifler</p>
      
      <!-- Sekme Kategorileri -->
      <div class="category-pills">
        <button class="pill-btn active" onclick="filterCategory('Tümü', this)">🍽️ Tümü</button>
        <button class="pill-btn" onclick="filterCategory('Karadeniz Mutfağı', this)">🌊 Karadeniz</button>
        <button class="pill-btn" onclick="filterCategory('İç Anadolu Mutfağı', this)">🌾 İç Anadolu</button>
        <button class="pill-btn" onclick="filterCategory('Ege Mutfağı', this)">🌿 Ege</button>
        <button class="pill-btn" onclick="filterCategory('Doğu Mutfağı', this)">🕌 Doğu</button>
        <button class="pill-btn" onclick="filterCategory('Sütlü Tatlılar', this)">🥛 Sütlü Tatlılar</button>
        <button class="pill-btn" onclick="filterCategory('Şerbetli Tatlılar', this)">🍯 Şerbetli Tatlılar</button>
        <button class="pill-btn" onclick="filterCategory('Kurabiyeler', this)">🍪 Kurabiyeler</button>
        <button class="pill-btn" onclick="filterCategory('Tuzlular', this)">🥐 Tuzlular</button>
      </div>
    </div>
  </header>

  <div class="search-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Tarif adı, malzeme veya kategori arayın...">
  </div>

  <div class="main-wrapper">
    <div class="container" id="recipeContainer">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px; color: #64748b;">Leziz tarifler yükleniyor...</p>
    </div>
  </div>

  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="mTitle" class="modal-title"></h2>
      
      <video id="mVideo" class="modal-video" controls style="display:none;"></video>
      
      <div class="section-subtitle">🛒 Malzemeler</div>
      <p id="mIngredients" class="modal-text"></p>
      
      <div class="section-subtitle">👩‍🍳 Hazırlanışı</div>
      <p id="mInstructions" class="modal-text"></p>
    </div>
  </div>

  <footer>
    &copy; 2026 Lezzet Mutfağı - Tüm Hakları Saklıdır.
  </footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDvUOzYlEGl7V822mbtjopaFFW833QuOLbUwB1MelQAMMYG50GUyDk2r3oeeiq0eBlYlD0hmwwpILS/pub?output=csv'; 

    let allRecipes = [];
    let currentCategory = 'Tümü';
    const defaultImage = 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80';

    // --- CANLI SAAT VE KARŞILAMA MESAJI DÖNGÜSÜ ---
    function updateClockAndGreeting() {
      const now = new Date();
      
      // Türkçe Tarih ve Saat Formatı
      const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
      const dateStr = now.toLocaleDateString('tr-TR', dateOptions);
      const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      document.getElementById('liveClock').innerText = `${timeStr} • ${dateStr}`;

      // Saate Göre Karşılama
      const hour = now.getHours();
      let greeting = "Hoş Geldiniz";
      if (hour >= 5 && hour < 12) greeting = "☀️ Günaydın! Bugün ne pişirsek?";
      else if (hour >= 12 && hour < 18) greeting = "👩‍🍳 Tünaydın! Nefis Lezzet Zamanı";
      else if (hour >= 18 && hour < 23) greeting = "🌙 İyi Akşamlar! Akşam Yemeği Hazır mı?";
      else greeting = "✨ Gece Kaçamağına Uygun Tarifler";

      document.getElementById('greeting').innerText = greeting;
    }

    setInterval(updateClockAndGreeting, 1000);
    updateClockAndGreeting();

    // --- TABLO VERİSİ YÜKLEME ---
    function loadRecipes() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allRecipes = results.data;
          applyFilters();
        },
        error: function(err) {
          document.getElementById('recipeContainer').innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #ef4444;'>Tarifler yüklenirken hata oluştu.</p>";
        }
      });
    }

    function renderRecipes(recipes) {
      const container = document.getElementById('recipeContainer');
      container.innerHTML = "";

      if(recipes.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px 0;'>Bu kategoride henüz tarif bulunamadı.</p>";
        return;
      }

      recipes.forEach((r, index) => {
        if(!r.baslik || r.baslik.trim() === "") return;

        let imageUrl = (r.resimUrl && r.resimUrl.trim() !== "") ? r.resimUrl : defaultImage;
        
        const card = `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${imageUrl}" alt="${r.baslik}" onerror="this.onerror=null;this.src='${defaultImage}';">
            </div>
            <div class="card-body">
              <span class="tag">${r.kategori || 'Lezzet'}</span>
              <h3 class="title">${r.baslik}</h3>
              <p class="desc">${r.aciklama || 'Enfes lezzet tarifi.'}</p>
              <button class="btn" onclick="openModal(${index})">
                <span>Tarifi İncele</span> ➔
              </button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function filterCategory(catName, btnElement) {
      currentCategory = catName;
      
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allRecipes.filter(r => {
        const matchesCategory = (currentCategory === 'Tümü') || (r.kategori && r.kategori.toLowerCase().trim() === currentCategory.toLowerCase().trim());
        
        const matchesSearch = (r.baslik && r.baslik.toLowerCase().includes(searchVal)) ||
                              (r.malzemeler && r.malzemeler.toLowerCase().includes(searchVal)) ||
                              (r.kategori && r.kategori.toLowerCase().includes(searchVal));

        return matchesCategory && matchesSearch;
      });

      renderRecipes(filtered);
    }

    function openModal(index) {
      const r = allRecipes[index];
      document.getElementById('mTitle').innerText = r.baslik;
      document.getElementById('mIngredients').innerText = r.malzemeler || 'Malzeme bilgisi bulunmuyor.';
      document.getElementById('mInstructions').innerText = r.tarif || 'Hazırlanış detayı bulunmuyor.';

      const video = document.getElementById('mVideo');
      if(r.videoUrl && r.videoUrl.trim() !== "") {
        video.src = r.videoUrl;
        video.style.display = "block";
      } else {
        video.style.display = "none";
        video.src = "";
      }

      document.getElementById('recipeModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('recipeModal').style.display = 'none';
      document.getElementById('mVideo').pause();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('recipeModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    loadRecipes();
  </script>
</body>
</html>
