<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezzet Mutfağı - Nefis Yemek Tarifleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #fdfbf7; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      color: white;
      padding: 50px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
    }

    header h1 { font-family: 'Playfair Display', serif; font-size: 42px; margin-bottom: 10px; }
    header p { font-size: 16px; opacity: 0.9; margin-bottom: 25px; }

    .category-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1100px; margin: 0 auto; }

    .pill-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .pill-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }
    .pill-btn.active { background: #ffffff; color: #ff6b35; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: #fff; }

    .season-pills { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
    .season-btn { background: rgba(0, 0, 0, 0.15); border-color: rgba(255, 255, 255, 0.2); }

    .search-container { margin: -25px auto 30px auto; max-width: 600px; padding: 0 20px; width: 100%; }
    .search-container input {
      width: 100%; padding: 16px 25px; border-radius: 50px; border: none; outline: none; font-size: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: all 0.3s ease;
    }

    .main-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; }
    .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; justify-content: center; }

    .card {
      background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      transition: all 0.3s ease; display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,0.02);
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }

    .card-img-wrapper { width: 100%; height: 200px; overflow: hidden; background-color: #f1f1f1; position: relative; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover img { transform: scale(1.05); }

    .season-badge {
      position: absolute; top: 12px; right: 12px; background: rgba(255, 255, 255, 0.9);
      padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; color: #333;
      backdrop-filter: blur(5px); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .tag { align-self: flex-start; font-size: 11px; font-weight: 600; color: #ff6b35; background: rgba(255, 107, 53, 0.1); padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 10px; }
    .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #222; }
    .desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 18px; flex: 1; }

    .btn { display: inline-block; width: 100%; padding: 12px; background-color: #ff6b35; color: white; text-align: center; border-radius: 10px; font-weight: 600; border: none; cursor: pointer; font-size: 14px; }
    .btn:hover { background-color: #ff8c42; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; padding: 20px; z-index: 1000; backdrop-filter: blur(3px); }
    .modal-content { background: white; padding: 35px; border-radius: 20px; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close { position: absolute; right: 20px; top: 15px; font-size: 26px; cursor: pointer; color: #999; }
    .modal-title { font-size: 28px; font-weight: 600; color: #222; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .section-subtitle { font-size: 16px; color: #ff6b35; margin-top: 20px; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .modal-text { white-space: pre-line; line-height: 1.7; color: #444; font-size: 14px; background: #fafafa; padding: 12px; border-radius: 8px; }

    footer { background: #333; color: white; text-align: center; padding: 20px; font-size: 13px; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <h1>✨ Lezzet Mutfağı</h1>
    <p>Mevsimine Uygun Ev Yapımı Nefis Tarifler</p>
    
    <!-- Kategoriler -->
    <div class="category-pills">
      <button class="pill-btn active" onclick="filterData('kategori', 'Tümü', this)">🍽️ Tümü</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Çorba Çeşitleri', this)">🍲 Çorbalar</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Zeytinyağlılar & Yaz', this)">☀️ Zeytinyağlı & Yaz</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Karadeniz Mutfağı', this)">🌊 Karadeniz</button>
      <button class="pill-btn" onclick="filterData('kategori', 'İç Anadolu Mutfağı', this)">🌾 İç Anadolu</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Ege Mutfağı', this)">🌿 Ege</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Doğu Mutfağı', this)">🕌 Doğu</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Sütlü Tatlılar', this)">🥛 Sütlü Tatlılar</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Şerbetli Tatlılar', this)">🍯 Şerbetli Tatlılar</button>
      <button class="pill-btn" onclick="filterData('kategori', 'Kurabiyeler', this)">🍪 Kurabiyeler</button>
    </div>

    <!-- Mevsim Filtreleri -->
    <div class="category-pills season-pills">
      <button class="pill-btn season-btn" onclick="filterData('mevsim', 'Yaz', this)">☀️ Yaz Tarifleri</button>
      <button class="pill-btn season-btn" onclick="filterData('mevsim', 'Kış', this)">❄️ Kış Tarifleri</button>
      <button class="pill-btn season-btn" onclick="filterData('mevsim', 'İlkbahar', this)">🌸 İlkbahar</button>
      <button class="pill-btn season-btn" onclick="filterData('mevsim', 'Sonbahar', this)">🍂 Sonbahar</button>
      <button class="pill-btn season-btn" onclick="filterData('mevsim', 'Her Mevsim', this)">🔄 Her Mevsim</button>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Yemek, malzeme, çorba veya mevsim arayın...">
  </div>

  <div class="main-wrapper">
    <div class="container" id="recipeContainer">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px; color: #666;">Tarifler yükleniyor...</p>
    </div>
  </div>

  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="mTitle" class="modal-title"></h2>
      <div id="mSeason" style="color: #888; font-size: 13px; margin-top: -10px; margin-bottom: 15px;"></div>
      <div class="section-subtitle">🛒 Malzemeler</div>
      <p id="mIngredients" class="modal-text"></p>
      <div class="section-subtitle">👩‍🍳 Hazırlanışı</div>
      <p id="mInstructions" class="modal-text"></p>
    </div>
  </div>

  <footer>&copy; 2026 Lezzet Mutfağı - Tüm Hakları Saklıdır.</footer>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDvUOzYlEGl7V822mbtjopaFFW833QuOLbUwB1MelQAMMYG50GUyDk2r3oeeiq0eBlYlD0hmwwpILS/pub?output=csv'; 
    const defaultImage = 'https://images.unsplash.com/photo-1495195134817-aeb325a55b65?q=80&w=600&auto=format&fit=crop';

    let allRecipes = [];
    let activeFilter = { type: 'all', value: 'Tümü' };

    function loadRecipes() {
      Papa.parse(SHEET_CSV_URL, {
        download: true, header: true, skipEmptyLines: true,
        complete: function(results) {
          allRecipes = results.data;
          renderRecipes(allRecipes);
        }
      });
    }

    function renderRecipes(recipes) {
      const container = document.getElementById('recipeContainer');
      container.innerHTML = "";

      if(recipes.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #666; padding: 40px 0;'>Aradığınız kriterlere uygun tarif bulunamadı.</p>";
        return;
      }

      recipes.forEach((r) => {
        let imageUrl = (r.resimUrl && r.resimUrl.trim() !== "") ? r.resimUrl : defaultImage;
        let seasonText = r.mevsim ? r.mevsim : 'Her Mevsim';
        
        const card = `
          <div class="card">
            <div class="card-img-wrapper">
              <span class="season-badge">🗓️ ${seasonText}</span>
              <img src="${imageUrl}" alt="${r.baslik}" onerror="this.onerror=null;this.src='${defaultImage}';">
            </div>
            <div class="card-body">
              <span class="tag">${r.kategori}</span>
              <h3 class="title">${r.baslik}</h3>
              <p class="desc">${r.aciklama}</p>
              <button class="btn" onclick="openModal('${r.baslik.replace(/'/g, "\\'")}')">Tarifi İncele ➔</button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    function handleSearch() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = allRecipes.filter(r => {
        const titleMatch = (r.baslik || '').toLowerCase().includes(searchVal);
        const ingredientsMatch = (r.malzemeler || '').toLowerCase().includes(searchVal);
        const categoryMatch = (r.kategori || '').toLowerCase().includes(searchVal);
        const seasonMatch = (r.mevsim || '').toLowerCase().includes(searchVal);
        
        if (searchVal === 'çorba' && (r.baslik || '').toLowerCase().includes('çorbası')) return true;

        return titleMatch || ingredientsMatch || categoryMatch || seasonMatch;
      });

      renderRecipes(filtered);
    }

    function filterData(type, val, btnElement) {
      document.getElementById('searchInput').value = "";
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (val === 'Tümü') {
        renderRecipes(allRecipes);
      } else {
        const filtered = allRecipes.filter(r => (r[type] || '').includes(val));
        renderRecipes(filtered);
      }
    }

    function openModal(title) {
      const r = allRecipes.find(item => item.baslik === title);
      if(!r) return;

      document.getElementById('mTitle').innerText = r.baslik;
      document.getElementById('mSeason').innerText = 'Mevsim: ' + (r.mevsim || 'Her Mevsim');
      document.getElementById('mIngredients').innerText = r.malzemeler;
      document.getElementById('mInstructions').innerText = r.tarif;
      document.getElementById('recipeModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('recipeModal').style.display = 'none'; }
    window.onclick = function(e) { if (e.target === document.getElementById('recipeModal')) closeModal(); }

    loadRecipes();
  </script>
</body>
</html>
