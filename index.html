<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezzet Mutfağı - Nefis Yemek Tarifleri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <style>
    /* --- Temel Stiller ve Reset --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #fdfbf7; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

    /* --- Gelişmiş Header Tasarımı (Turuncu Alan) --- */
    header {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
      color: white;
      padding: 60px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    header p { font-size: 18px; opacity: 0.9; margin-bottom: 30px; }

    /* --- Modern Kategori Sekmeleri --- */
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .pill-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }
    .pill-btn.active { background: #ffffff; color: #ff6b35; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-color: #fff; }

    /* --- Modern Arama Çubuğu --- */
    .search-container {
      margin: -30px auto 40px auto;
      max-width: 600px;
      padding: 0 20px;
      width: 100%;
    }

    .search-container input {
      width: 100%;
      padding: 18px 25px;
      border-radius: 50px;
      border: none;
      outline: none;
      font-size: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }

    .search-container input:focus { box-shadow: 0 10px 30px rgba(255, 107, 53, 0.15); }

    /* --- Ana İçerik Alanı ve Kart Grid --- */
    .main-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; }
    .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; justify-content: center; }

    /* --- Modern Yemek Kartı Tasarımı --- */
    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }

    .card-img-wrapper {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background-color: #f1f1f1; /* Resim yüklenirken arka plan */
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Resmi kutuya sığdır ve kırp */
      transition: transform 0.5s ease;
    }

    .card:hover img { transform: scale(1.05); }

    .card-body { padding: 25px; display: flex; flex-direction: column; flex: 1; }

    .tag {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 600;
      color: #ff6b35;
      background: rgba(255, 107, 53, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .title { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: #222; line-height: 1.3; }
    .desc { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 20px; flex: 1; }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background-color: #ff6b35;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
      border: none;
      font-size: 15px;
    }

    .btn:hover { background-color: #ff8c42; }

    /* --- Gelişmiş Modal (Pop-up) Stilleri --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
      backdrop-filter: blur(3px);
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 25px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .close { position: absolute; right: 25px; top: 20px; font-size: 28px; cursor: pointer; color: #999; transition: color 0.3s; }
    .close:hover { color: #ff6b35; }

    .modal-title { font-size: 32px; font-weight: 600; color: #222; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .section-subtitle { font-size: 18px; color: #ff6b35; margin-top: 25px; margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    
    .modal-text { white-space: pre-line; line-height: 1.8; color: #444; font-size: 15px; background: #fafafa; padding: 15px; border-radius: 10px; }

    footer { background: #333; color: white; text-align: center; padding: 20px; font-size: 14px; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <h1>✨ Lezzet Mutfağı</h1>
    <p>Ev Yapımı En Özel & En Lezzetli Tarifler</p>
    
    <!-- Kategori Sekmeleri (Yeni Eklenen: Çorba Çeşitleri) -->
    <div class="category-pills">
      <button class="pill-btn active" onclick="filterCategory('Tümü', this)">🍽️ Tümü</button>
      <button class="pill-btn" onclick="filterCategory('Çorba Çeşitleri', this)">🍲 Çorba Çeşitleri</button>
      <button class="pill-btn" onclick="filterCategory('Karadeniz Mutfağı', this)">🌊 Karadeniz</button>
      <button class="pill-btn" onclick="filterCategory('İç Anadolu Mutfağı', this)">🌾 İç Anadolu</button>
      <button class="pill-btn" onclick="filterCategory('Ege Mutfağı', this)">🌿 Ege</button>
      <button class="pill-btn" onclick="filterCategory('Doğu Mutfağı', this)">🕌 Doğu</button>
      <button class="pill-btn" onclick="filterCategory('Sütlü Tatlılar', this)">🥛 Sütlü Tatlılar</button>
      <button class="pill-btn" onclick="filterCategory('Şerbetli Tatlılar', this)">🍯 Şerbetli Tatlılar</button>
      <button class="pill-btn" onclick="filterCategory('Kurabiyeler', this)">🍪 Kurabiyeler</button>
      <button class="pill-btn" onclick="filterCategory('Tuzlular', this)">🥐 Tuzlular</button>
    </div>
  </header>

  <!-- Arama Çubuğu -->
  <div class="search-container">
    <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Tarif adı, malzeme veya çorba arayın...">
  </div>

  <!-- Ana İçerik -->
  <div class="main-wrapper">
    <div class="container" id="recipeContainer">
      <p style="text-align: center; grid-column: 1/-1; padding: 40px; color: #666;">Tarifler yükleniyor...</p>
    </div>
  </div>

  <!-- Tarif Detay Penceresi (Modal) -->
  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="mTitle" class="modal-title"></h2>
      
      <div class="section-subtitle">🛒 Malzemeler</div>
      <p id="mIngredients" class="modal-text"></p>
      
      <div class="section-subtitle">👩‍🍳 Hazırlanışı</div>
      <p id="mInstructions" class="modal-text"></p>
    </div>
  </div>

  <footer>
    &copy; 2024 Lezzet Mutfağı - Tüm Hakları Saklıdır.
  </footer>

  <script>
    // CSV Dosyasının Yayınlanan URL'si
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSDvUOzYlEGl7V822mbtjopaFFW833QuOLbUwB1MelQAMMYG50GUyDk2r3oeeiq0eBlYlD0hmwwpILS/pub?output=csv'; 

    // Resim yüklenemezse kullanılacak varsayılan resim
    const defaultImage = 'https://images.unsplash.com/photo-1495195134817-aeb325a55b65?q=80&w=600&auto=format&fit=crop';

    let allRecipes = [];
    let currentCategory = 'Tümü';

    // Verileri Yükle
    function loadRecipes() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allRecipes = results.data;
          renderRecipes(allRecipes);
        },
        error: function(err) {
          document.getElementById('recipeContainer').innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: red;'>Veriler yüklenirken hata oluştu.</p>";
        }
      });
    }

    // Kartları Ekrana Bas
    function renderRecipes(recipes) {
      const container = document.getElementById('recipeContainer');
      container.innerHTML = "";

      if(recipes.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #666; padding: 40px 0;'>Aradığınız kriterlere uygun tarif bulunamadı.</p>";
        return;
      }

      recipes.forEach((r, index) => {
        // Tablodan gelen resim URL'sini kontrol et, yoksa varsayılanı kullan
        let imageUrl = (r.resimUrl && r.resimUrl.trim() !== "") ? r.resimUrl : defaultImage;
        
        const card = `
          <div class="card">
            <div class="card-img-wrapper">
              <img src="${imageUrl}" alt="${r.baslik}" onerror="this.onerror=null;this.src='${defaultImage}';">
            </div>
            <div class="card-body">
              <span class="tag">${r.kategori}</span>
              <h3 class="title">${r.baslik}</h3>
              <p class="desc">${r.aciklama}</p>
              <button class="btn" onclick="openModal(${index})">Tarifi İncele ➔</button>
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // Arama Fonksiyonu (Geliştirilmiş: "Çorba" kelimesine duyarlı)
    function handleSearch() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      
      // Arama motorunu güçlendir
      const filtered = allRecipes.filter(r => {
        const titleMatch = r.baslik.toLowerCase().includes(searchVal);
        const ingredientsMatch = r.malzemeler.toLowerCase().includes(searchVal);
        const categoryMatch = r.kategori.toLowerCase().includes(searchVal);
        
        // Eğer arama "çorba" ise ve tarifin adında çorba geçiyorsa kategoriye bakmadan getir
        if (searchVal === 'çorba' && r.baslik.toLowerCase().includes('çorbası')) {
          return true;
        }

        return titleMatch || ingredientsMatch || categoryMatch;
      });

      // Eğer kategori seçiliyse, arama sonucunu kategori içinde daralt
      const finalFiltered = (currentCategory === 'Tümü') 
        ? filtered 
        : filtered.filter(r => r.kategori === currentCategory);

      renderRecipes(finalFiltered);
    }

    // Kategori Filtreleme
    function filterCategory(catName, btnElement) {
      currentCategory = catName;
      document.getElementById('searchInput').value = ""; // Kategori değişince aramayı sıfırla
      
      // Aktif buton stilini değiştir
      document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if (catName === 'Tümü') {
        renderRecipes(allRecipes);
      } else {
        const filtered = allRecipes.filter(r => r.kategori === catName);
        renderRecipes(filtered);
      }
    }

    // Modal Pencereyi Aç
    function openModal(index) {
      // O an ekranda görünen tarifler arasından seç
      const recipesToUse = (currentCategory === 'Tümü' && document.getElementById('searchInput').value === "")
        ? allRecipes
        : (document.getElementById('recipeContainer').querySelectorAll('.card').length === allRecipes.length)
          ? allRecipes
          : allRecipes; // Bu kısım arama ve kategori kombinasyonları için kompleks, şimdilik basit tutuyoruz.
      
      // Basit çözüm: Başlığa göre veriyi allRecipes içinden bul
      const cardTitle = document.getElementById('recipeContainer').querySelectorAll('.title')[index].innerText;
      const r = allRecipes.find(item => item.baslik === cardTitle);

      document.getElementById('mTitle').innerText = r.baslik;
      document.getElementById('mIngredients').innerText = r.malzemeler;
      document.getElementById('mInstructions').innerText = r.tarif;
      document.getElementById('recipeModal').style.display = 'flex';
    }

    // Modal Pencereyi Kapat
    function closeModal() {
      document.getElementById('recipeModal').style.display = 'none';
    }

    // Pencere dışına tıklayınca kapat
    window.onclick = function(event) {
      const modal = document.getElementById('recipeModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // Başlangıçta tarifleri yükle
    loadRecipes();
  </script>
</body>
</html>
